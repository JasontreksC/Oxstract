name: oxstract

# app: API and web page on one port. worker: proxies now, analysis and rendering later.
# Both run the same image and share the media volume (SQLite database included).
# CPU only. Nothing but the app port is published.

x-common: &common
  build: .
  image: oxstract:local
  environment:
    MEDIA_ROOT: /data
    CONFIG_DIR: /app/config
  volumes:
    - ./config:/app/config
    - media:/data
  restart: unless-stopped

services:
  app:
    <<: *common
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *common
    command: ["python", "-m", "app.worker"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  media:
