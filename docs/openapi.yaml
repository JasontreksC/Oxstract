openapi: 3.1.0
info:
  title: Oxstract
  version: 0.1.0
  description: |
    로컬 영상 편집 API. 계획서 4장, 5.0, 5.5의 목표 계약이다.
    현재 서버 스텁은 처리 라우트에서 501을 반환한다. 설명은 docs/api.md를 본다.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: 프로세스 확인
      operationId: health
      responses:
        "200":
          description: 기동됨
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /videos:
    post:
      summary: 영상 업로드
      operationId: uploadVideo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 저장됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoCreated"
  /videos/{video_id}/frame:
    get:
      summary: 객체 선택용 프레임
      operationId: getFrame
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/Time"
      responses:
        "200":
          description: 프레임 이미지
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
  /videos/{video_id}/file:
    get:
      summary: 원본 영상 내려받기
      operationId: getVideoFile
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: 원본 영상 바이트
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: 영상 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /videos/{video_id}/detect:
    post:
      summary: 한 프레임의 탐지 박스
      operationId: detectFrame
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/Time"
      responses:
        "200":
          description: 박스 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
  /jobs:
    post:
      summary: 추적과 컷 추출 시작
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "202":
          description: 큐에 넣음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobView"
  /jobs/{job_id}:
    get:
      summary: 상태와 구간 목록
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 작업
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobView"
  /jobs/{job_id}/segments:
    patch:
      summary: 구간과 컷별 전환 수정
      operationId: updateSegments
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentList"
      responses:
        "200":
          description: 저장된 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentList"
        "422":
          description: 마지막 구간에 전환이 있거나 시각이 잘못됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{job_id}/render:
    post:
      summary: 최종 합성
      operationId: renderJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: 렌더 시작
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderAccepted"
  /jobs/{job_id}/output:
    get:
      summary: 결과 영상 다운로드
      operationId: getOutput
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: mp4
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: 결과 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /jobs/{job_id}/progress:
    get:
      summary: 진행률 WebSocket
      description: |
        HTTP GET이 아니다. 클라이언트는 이 경로로 WebSocket을 연다.
        예: ws://127.0.0.1:8000/jobs/{job_id}/progress
        서버는 ProgressEvent JSON을 보낸다.
      operationId: jobProgress
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "101":
          description: Switching Protocols
components:
  parameters:
    VideoId:
      name: video_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    Time:
      name: t
      in: query
      required: true
      schema:
        type: number
        minimum: 0
      description: 원본 영상 시각(초)
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    BBox:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0
    DetectionBox:
      type: object
      additionalProperties: false
      required: [bbox]
      properties:
        bbox:
          $ref: "#/components/schemas/BBox"
        class_name:
          type: ["string", "null"]
        confidence:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
    DetectResponse:
      type: object
      additionalProperties: false
      required: [t, boxes]
      properties:
        t:
          type: number
          minimum: 0
        boxes:
          type: array
          items:
            $ref: "#/components/schemas/DetectionBox"
    TransitionAfter:
      type: object
      additionalProperties: false
      required: [type]
      description: 마지막 컷에는 쓰지 않는다. 자세한 조건은 schemas/transition.schema.json.
      properties:
        type:
          type: string
          enum: [fade, text_card, none]
        duration:
          type: ["number", "null"]
          exclusiveMinimum: 0
        bg_color:
          type: ["string", "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
        text:
          type: ["string", "null"]
        font_size:
          type: ["number", "null"]
          exclusiveMinimum: 0
        font_color:
          type: ["string", "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
    Segment:
      type: object
      additionalProperties: false
      required: [start, end, score]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          exclusiveMinimum: 0
        score:
          type: number
          minimum: 0
          maximum: 1
        transition_after:
          anyOf:
            - $ref: "#/components/schemas/TransitionAfter"
            - type: "null"
    SegmentList:
      type: object
      additionalProperties: false
      required: [segments]
      properties:
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
    JobOptions:
      type: object
      additionalProperties: false
      properties:
        motion_threshold:
          type: number
          minimum: 0
          default: 0.05
        min_segment_duration:
          type: number
          exclusiveMinimum: 0
          default: 1
        padding:
          type: number
          minimum: 0
          default: 0.3
        include_audio:
          type: boolean
          default: true
    JobTarget:
      type: object
      additionalProperties: false
      properties:
        text:
          type: ["string", "null"]
        class_name:
          type: ["string", "null"]
    JobCreate:
      type: object
      additionalProperties: false
      required: [video_id, frame_t, bbox, source]
      properties:
        video_id:
          type: string
        frame_t:
          type: number
          minimum: 0
        bbox:
          $ref: "#/components/schemas/BBox"
        source:
          type: string
          enum: [drag, detect]
        class:
          type: ["string", "null"]
        target:
          anyOf:
            - $ref: "#/components/schemas/JobTarget"
            - type: "null"
        options:
          $ref: "#/components/schemas/JobOptions"
    VideoCreated:
      type: object
      additionalProperties: false
      required: [id, filename]
      properties:
        id:
          type: string
        filename:
          type: string
        content_type:
          type: ["string", "null"]
        duration:
          type: ["number", "null"]
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
    DriveLink:
      type: object
      additionalProperties: false
      properties:
        web_view_link:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
    JobView:
      type: object
      additionalProperties: false
      required: [id, video_id, status, progress, segments, output_ready]
      properties:
        id:
          type: string
        video_id:
          type: string
        status:
          type: string
          enum: [queued, running, awaiting_edit, rendering, uploading, completed, failed]
        progress:
          type: number
          minimum: 0
          maximum: 1
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
        error:
          type: ["string", "null"]
        output_ready:
          type: boolean
        drive:
          anyOf:
            - $ref: "#/components/schemas/DriveLink"
            - type: "null"
    RenderAccepted:
      type: object
      additionalProperties: false
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          const: rendering
    ProgressEvent:
      type: object
      additionalProperties: false
      required: [job_id, stage, progress]
      properties:
        job_id:
          type: string
        stage:
          type: string
          enum: [detect, track, segment, render, upload, done, error]
        progress:
          type: number
          minimum: 0
          maximum: 1
        message:
          type: string
        drive:
          anyOf:
            - $ref: "#/components/schemas/DriveLink"
            - type: "null"
